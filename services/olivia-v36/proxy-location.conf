    # Vialterna3 demo only. Existing Olivia routes remain on the current gateway.
    location ^~ /vialterna-demo/ {
        if ($scheme != https) { return 403; }
        client_max_body_size 32k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $vialterna36 http://vialterna3-olivia36:8093;
        rewrite ^/vialterna-demo/(.*)$ /$1 break;
        proxy_pass $vialterna36;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_read_timeout 65s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
